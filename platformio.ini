[platformio]
default_envs = esp32-s3-headless

[env:esp32-s3-headless]
; Pinned to the exact platform used for the verified Version 2 build.
; Do not replace this with /stable/ without a full hardware regression test.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
; Headless master: no display or touch. The memory layout still targets an
; ESP32-S3 N16R8 module (16 MB QIO flash, 8 MB octal PSRAM); change it
; together with the PCB if a different module is fitted.
board = esp32-s3-devkitc1-n16r8
framework = arduino
monitor_speed = 115200
upload_speed = 460800
upload_protocol = esptool
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_RUNNING_CORE=0
    -Iinclude
lib_deps =
    h2zero/NimBLE-Arduino@2.5.0

[env:esp32-s3-headless-ota]
extends = env:esp32-s3-headless
upload_protocol = espota
upload_port = 192.168.4.1
