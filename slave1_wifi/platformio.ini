[platformio]
default_envs = slave-gpio2-active-high

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Eski LED_NODE_1 donanimi: harici LED GPIO4, aktif-dusuk.
[env:slave-gpio4-active-low]
build_flags =
    -DLED_PIN=4
    -DLED_ACTIVE_LEVEL=LOW
    -DONBOARD_LED_PIN=2

; Eski LED_NODE_2 donanimi: LED GPIO2, aktif-yuksek.
[env:slave-gpio2-active-high]
build_flags =
    -DLED_PIN=2
    -DLED_ACTIVE_LEVEL=HIGH
    -DONBOARD_LED_PIN=-1
