name: PlatformIO Build

on:
  push:
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned PlatformIO
        run: python -m pip install -r requirements.txt
      - name: Build firmware
        run: python -m platformio run
      - name: Build Wi-Fi slave
        run: python -m platformio run -d slave1_wifi
      - name: Build BLE slave
        run: python -m platformio run -d slave2_ble
